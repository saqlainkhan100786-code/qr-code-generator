<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="google-site-verification" content="IVNFZ31XeO8_iYXkL1IY5yD9nBt83zH_iXrpHe8g244" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Free QR Code Generator - Create QR Codes Online</title>

  <meta
    name="description"
    content="Create free QR codes online instantly. Generate QR codes for websites, text, contact information and more. Download your QR code for free."
  >

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7fb;
      color: #172033;
      min-height: 100vh;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 22px 16px;
      text-align: center;
    }

    header h1 {
      color: #2563eb;
      font-size: 28px;
      margin-bottom: 8px;
    }

    header p {
      color: #667085;
      font-size: 15px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: 35px auto;
      padding: 0 16px;
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
    }

    .card h2 {
      font-size: 22px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 9px;
    }

    textarea {
      width: 100%;
      min-height: 130px;
      padding: 15px;
      border: 1px solid #d0d5dd;
      border-radius: 12px;
      outline: none;
      font-size: 16px;
      line-height: 1.5;
      resize: vertical;
    }

    textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    button {
      flex: 1;
      border: none;
      border-radius: 11px;
      padding: 14px 16px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .generate-btn {
      background: #2563eb;
      color: #ffffff;
    }

    .generate-btn:hover {
      background: #1d4ed8;
    }

    .clear-btn {
      background: #eef2f7;
      color: #344054;
    }

    .clear-btn:hover {
      background: #e4e7ec;
    }

    .result {
      display: none;
      margin-top: 30px;
      padding-top: 28px;
      border-top: 1px solid #e5e7eb;
      text-align: center;
    }

    .result h2 {
      margin-bottom: 20px;
    }

    #qrcode {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
      padding: 15px;
      min-height: 250px;
    }

    #qrcode img {
      max-width: 100%;
      height: auto;
    }

    .download-btn {
      width: 100%;
      margin-top: 20px;
      background: #111827;
      color: #ffffff;
    }

    .download-btn:hover {
      background: #000000;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 9px;
      background: #fff4e5;
      color: #8a4b08;
      font-size: 14px;
    }

    .info {
      margin-top: 28px;
      text-align: center;
      color: #667085;
      font-size: 14px;
      line-height: 1.6;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 25px;
    }

    .feature {
      background: #f8fafc;
      border: 1px solid #eaecf0;
      border-radius: 12px;
      padding: 15px 10px;
      text-align: center;
      font-size: 13px;
      color: #475467;
    }

    footer {
      text-align: center;
      padding: 30px 15px;
      color: #667085;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 24px;
      }

      .card {
        padding: 20px;
      }

      .button-group {
        flex-direction: column;
      }

      .features {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Free QR Code Generator</h1>
    <p>Create and download QR codes instantly</p>
  </header>

  <main class="container">

    <div class="card">

      <h2>Create Your QR Code</h2>

      <label for="qrText">Enter text or URL</label>

      <textarea
        id="qrText"
        placeholder="Example: https://example.com"
      ></textarea>

      <div class="button-group">
        <button
          class="generate-btn"
          type="button"
          onclick="generateQR()"
        >
          Generate QR Code
        </button>

        <button
          class="clear-btn"
          type="button"
          onclick="clearQR()"
        >
          Clear
        </button>
      </div>

      <div id="message" class="message"></div>

      <div id="result" class="result">

        <h2>Your QR Code</h2>

        <div id="qrcode"></div>

        <button
          class="download-btn"
          type="button"
          onclick="downloadQR()"
        >
          Download QR Code
        </button>

      </div>

      <div class="info">
        Generate QR codes for websites, text, contact information
        and more. Free and easy to use.
      </div>

      <div class="features">
        <div class="feature">
          ✓ Free to Use
        </div>

        <div class="feature">
          ✓ No Registration
        </div>

        <div class="feature">
          ✓ Download QR Code
        </div>
      </div>

    </div>

  </main>

  <footer>
    © 2026 Free QR Code Generator
  </footer>

  <script>
    let qrCode = null;

    function showMessage(text) {
      const message = document.getElementById("message");

      message.textContent = text;
      message.style.display = "block";
    }

    function hideMessage() {
      const message = document.getElementById("message");

      message.textContent = "";
      message.style.display = "none";
    }

    function generateQR() {
      hideMessage();

      const input = document.getElementById("qrText");
      const text = input.value.trim();

      if (text === "") {
        showMessage("Please enter some text or a URL first.");
        return;
      }

      const qrContainer = document.getElementById("qrcode");
      const result = document.getElementById("result");

      qrContainer.innerHTML = "";

      if (typeof QRCode === "undefined") {
        showMessage("QR Code library could not load. Please refresh the page.");
        return;
      }

      qrCode = new QRCode(qrContainer, {
        text: text,
        width: 250,
        height: 250,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });

      result.style.display = "block";
    }

    function downloadQR() {
      hideMessage();

      const canvas = document.querySelector("#qrcode canvas");

      if (!canvas) {
        showMessage("Please generate a QR code first.");
        return;
      }

      canvas.toBlob(function(blob) {
        if (!blob) {
          showMessage("Download failed. Please try again.");
          return;
        }

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");

        link.href = url;
        link.download = "qr-code.png";

        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        setTimeout(function() {
          URL.revokeObjectURL(url);
        }, 1000);
      }, "image/png");
    }

    function clearQR() {
      document.getElementById("qrText").value = "";
      document.getElementById("qrcode").innerHTML = "";
      document.getElementById("result").style.display = "none";

      hideMessage();

      qrCode = null;
    }
  </script>

</body>
</html>
